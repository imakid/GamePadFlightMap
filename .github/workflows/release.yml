name: Package and Release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package Addon
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p package/FlightMap_Gamepad
          cp FlightMap_Gamepad.toc Core.lua GamePad.lua CHANGELOG.md README.md package/FlightMap_Gamepad/

          # Generate release.json for WoWUp compatibility
          cat > package/release.json << EOF
          {
            "releases": [
              {
                "name": "FlightMap_Gamepad",
                "version": "v${VERSION}",
                "filename": "FlightMap_Gamepad-v${VERSION}.zip",
                "nolib": false,
                "metadata": [
                  {
                    "flavor": "mainline",
                    "interface": 120005
                  }
                ]
              }
            ]
          }
          EOF

          cd package
          zip -r "../FlightMap_Gamepad-v${VERSION}.zip" FlightMap_Gamepad/
          cp release.json "../release.json"
          cd ..
          echo "Created: FlightMap_Gamepad-v${VERSION}.zip"
          unzip -l "FlightMap_Gamepad-v${VERSION}.zip"
          cat release.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            FlightMap_Gamepad-v*.zip
            release.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
